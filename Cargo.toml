[package]
name = "phoenix-sdk"
version = "0.1.0"
edition = "2021"
description = "A JavaScript/TypeScript SDK for accessing Phoenix market data and orderbook information"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Core dependencies (used in both Rust and WASM builds)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
futures = "0.3"
rand = "0.8"

# New Phoenix DEX dependencies
solana-client = "1.18"
solana-sdk = "1.18"
anchor-client = "0.29"
anchor-lang = "0.29"
tokio = { version = "1.0", features = ["full"] }
tokio-tungstenite = "0.20"
uuid = "1.0"
thiserror = "1.0"
borsh = "0.10"
reqwest = { version = "0.11", features = ["json"] }
url = "2.4"
env_logger = "0.10"

# Binary targets
[[bin]]
name = "test_phoenix"
path = "src/bin/test_phoenix.rs"

# WASM-specific dependencies (only used when targeting wasm32)
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.87"
wasm-bindgen-futures = "0.4.37"
js-sys = "0.3.64"
web-sys = { version = "0.3.64", features = [
    "console",
    "Headers",
    "Request",
    "RequestInit",
    "RequestMode",
    "Response",
    "Window",
    "WebSocket",
    "MessageEvent",
    "BinaryType",
    "CloseEvent",
    "ErrorEvent",
] }
console_error_panic_hook = "0.1.7"
serde-wasm-bindgen = "0.5"

[dev-dependencies]
wasm-bindgen-test = "0.3.37"
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = true
